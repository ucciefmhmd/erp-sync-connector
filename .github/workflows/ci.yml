name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test (with code coverage)
        run: dotnet test --no-build -c Release -- --coverage --coverage-output-format cobertura

      - name: Coverage report
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:**/TestResults/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            "-reporttypes:MarkdownSummaryGithub;Cobertura" \
            "-assemblyfilters:+ErpSync.Domain;+ErpSync.Application;+ErpSync.Infrastructure;+ErpSync.Api" \
            "-classfilters:-ErpSync.Infrastructure.Persistence.Migrations.*;-Microsoft.*;-System.*"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

      - name: Fail on known-vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qi "has the following vulnerable packages" vulnerable.txt

  docker-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f src/ErpSync.Api/Dockerfile -t erpsync-api:ci .

      - name: Build mock ERP image
        run: docker build -f tools/ErpSync.MockErp/Dockerfile -t erpsync-mock-erp:ci .
