# Demo stack: the connector plus the mock ERP.  Run:  docker compose up --build
# All credentials below are demo values. Real deployments inject secrets from a secret store.
services:
  mock-erp:
    build:
      context: .
      dockerfile: tools/ErpSync.MockErp/Dockerfile
    environment:
      MockErp__ClientId: erpsync-demo
      MockErp__ClientSecret: ${ERP_CLIENT_SECRET:-demo-secret-change-me}
    ports:
      - "5080:8080"

  api:
    build:
      context: .
      dockerfile: src/ErpSync.Api/Dockerfile
    depends_on:
      - mock-erp
    environment:
      Erp__BaseUrl: http://mock-erp:8080
      Erp__ClientId: erpsync-demo
      Erp__ClientSecret: ${ERP_CLIENT_SECRET:-demo-secret-change-me}
      # SHA-256 of the demo key "dev-local-key-change-me"
      Authentication__ApiClients__0__Name: demo-client
      Authentication__ApiClients__0__KeyHash: DCF59BDF03489DCBECDEED9E684A5025815495179927E80F61869324F63B7BC5
      Authentication__ApiClients__0__Scopes__0: catalog:read
      Authentication__ApiClients__0__Scopes__1: orders:write
      Authentication__ApiClients__0__Scopes__2: sync:admin
      OpenApi__Enabled: "true"
    ports:
      - "5100:8080"
    volumes:
      - erpsync-data:/data

volumes:
  erpsync-data:
